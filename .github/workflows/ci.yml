name: CI

on:
  push:
    branches:
      - main

jobs:
  check-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Check Linux environment
        run: |
         echo "=== Linux Environment Information ==="
          echo "User:"
          whoami
          echo "Current directory:"
          pwd
          echo "Kernel:"
          uname -a
          echo "Disk usage:"
          df -h
          echo "Memory:"
          free -h
          

      - name: Check index.html
        run: |
          test -f index.html
          grep -q "<h1>" index.html

      - name: CI completed
        run: echo "CI checks passed successfully"
